services:
  postgres:
    image: postgres:16-alpine
    container_name: aizorix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aizorix
      POSTGRES_PASSWORD: aizorix_dev
      POSTGRES_DB: aizorix
    ports:
      - "5433:5432"
    volumes:
      - aizorix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aizorix -d aizorix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aizorix_pgdata:
